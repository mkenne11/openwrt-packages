name: Publish OpenWrt APK v3 Feed

on:
  push:
    branches:
      - main
      - "openwrt-*"
    paths:
      - "net/**"
      - "utils/**"
      - "admin/**"
      - "libs/**"
      - "keys/public-key.pem"
      - "scripts/build-apk.sh"
      - ".github/workflows/publish-feed.yml"
  schedule:
    # Weekly rebuild every Sunday at 04:00 UTC to pick up OpenWrt SDK/ABI updates
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      openwrt_series:
        description: "OpenWrt release series (e.g. 25.12)"
        required: false
        default: "25.12"
      packages:
        description: "Comma-separated package names to build, or 'all'"
        required: false
        default: "all"
      targets:
        description: "JSON array of OpenWrt target/subtarget pairs (mediatek/filogic, mediatek/mt7622)"
        required: false
        default: '["mediatek/filogic","mediatek/mt7622"]'
      deploy_pages:
        description: "Deploy built APK v3 repository to GitHub Pages"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-apk-feed"
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      openwrt_series: ${{ steps.set.outputs.openwrt_series }}
      packages: ${{ steps.set.outputs.packages }}
      targets: ${{ steps.set.outputs.targets }}
      deploy_pages: ${{ steps.set.outputs.deploy_pages }}
    steps:
      - id: set
        env:
          INPUT_SERIES: ${{ github.event.inputs.openwrt_series }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          INPUT_DEPLOY: ${{ github.event.inputs.deploy_pages }}
        run: |
          SERIES="${INPUT_SERIES:-25.12}"
          if [ -z "$INPUT_SERIES" ] && [[ "${GITHUB_REF_NAME}" == openwrt-* ]]; then
            SERIES="${GITHUB_REF_NAME#openwrt-}"
          fi
          PACKAGES="${INPUT_PACKAGES:-all}"
          TARGETS="${INPUT_TARGETS:-[\"mediatek/filogic\",\"mediatek/mt7622\"]}"
          DEPLOY="${INPUT_DEPLOY:-true}"

          echo "openwrt_series=${SERIES}" >> "$GITHUB_OUTPUT"
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"
          echo "deploy_pages=${DEPLOY}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-matrix.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and sign OpenWrt APK v3 packages
        env:
          SERIES: ${{ needs.prepare-matrix.outputs.openwrt_series }}
          PACKAGES: ${{ needs.prepare-matrix.outputs.packages }}
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh \
            --mode docker \
            --target "${{ matrix.target }}" \
            --package "${PACKAGES}" \
            --openwrt-series "${SERIES}" \
            --docker-tag "openwrt-${SERIES}" \
            --require-signing \
            --no-cache

          # Verify exported public signing key is present alongside signed artifacts
          test -n "$(find "dist/${SERIES}" -name 'public-key.pem' -print -quit)"

          # Record sanitized target name for unique artifact naming (both mediatek/filogic and mediatek/mt7622 share aarch64_cortex-a53)
          TARGET_SLUG="$(printf '%s' "${{ matrix.target }}" | tr '/' '-')"
          echo "ARTIFACT_TARGET=${TARGET_SLUG}" >> "$GITHUB_ENV"

      - name: Upload target APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ needs.prepare-matrix.outputs.openwrt_series }}-${{ env.ARTIFACT_TARGET }}
          path: dist/${{ needs.prepare-matrix.outputs.openwrt_series }}/**
          if-no-files-found: error

  publish:
    needs: [prepare-matrix, build]
    if: needs.prepare-matrix.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all target APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-${{ needs.prepare-matrix.outputs.openwrt_series }}-*
          path: staging

      - name: Assemble GitHub Pages APK v3 feed directory
        env:
          SERIES: ${{ needs.prepare-matrix.outputs.openwrt_series }}
        run: |
          mkdir -p "public/${SERIES}"

          # Publish feed ECDSA public key (prefer key exported from signing secret, else repo key)
          PUB_FOUND=""
          for target_dir in staging/apk-"${SERIES}"-*; do
            [ -d "$target_dir" ] || continue
            for arch_dir in "${target_dir}"/*; do
              [ -d "$arch_dir" ] || continue
              arch="$(basename "$arch_dir")"
              mkdir -p "public/${SERIES}/${arch}"
              cp -f "${arch_dir}"/*.apk "public/${SERIES}/${arch}/"
              cp -f "${arch_dir}/packages.adb" "public/${SERIES}/${arch}/"
              cp -f "${arch_dir}/SHA256SUMS" "public/${SERIES}/${arch}/"
              if [ -z "$PUB_FOUND" ] && [ -f "${arch_dir}/public-key.pem" ]; then
                cp -f "${arch_dir}/public-key.pem" public/public-key.pem
                PUB_FOUND=1
              fi
            done
          done

          if [ -z "$PUB_FOUND" ] && [ -f keys/public-key.pem ]; then
            cp -f keys/public-key.pem public/public-key.pem
          fi

          # Generate a simple static landing page listing available architectures
          {
            cat <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>OpenWrt ${SERIES} APK v3 Package Feed</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
              pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; border-radius: 6px; }
              code { font-family: ui-monospace, monospace; }
            </style>
          </head>
          <body>
            <h1>OpenWrt ${SERIES} APK v3 Package Feed</h1>
            <p>Public signing key: <a href="public-key.pem">public-key.pem</a></p>
            <h2>Available Architectures (${SERIES})</h2>
            <ul>
          HTML
            for arch_dir in "public/${SERIES}"/*; do
              [ -d "$arch_dir" ] || continue
              arch="$(basename "$arch_dir")"
              printf '      <li><code>%s</code> — <a href="%s/%s/packages.adb">packages.adb</a> | <a href="%s/%s/SHA256SUMS">SHA256SUMS</a></li>\n' \
                "$arch" "$SERIES" "$arch" "$SERIES" "$arch"
            done
            cat <<'HTML'
            </ul>
          </body>
          </html>
          HTML
          } > public/index.html

          find public -maxdepth 3 | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
