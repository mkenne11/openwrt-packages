name: Publish OpenWrt APK v3 Feed

on:
  push:
    branches:
      - main
      - "openwrt-*"
    paths:
      - "net/**"
      - "utils/**"
      - "admin/**"
      - "libs/**"
      - "keys/public-key.pem"
      - "scripts/build-apk.sh"
      - "scripts/merge-feed.sh"
      - ".github/workflows/publish-feed.yml"
  schedule:
    # Weekly rebuild every Sunday at 04:00 UTC to pick up OpenWrt SDK/ABI updates
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      openwrt_series:
        description: "OpenWrt release series (e.g. 25.12)"
        required: false
        default: "25.12"
      packages:
        description: "Comma-separated package names to build, or 'all'"
        required: false
        default: "all"
      targets:
        description: "JSON array of OpenWrt target/subtarget pairs (mediatek/filogic, mediatek/mt7622)"
        required: false
        default: '["mediatek/filogic","mediatek/mt7622"]'
      deploy_pages:
        description: "Deploy built APK v3 repository to GitHub Pages"
        type: boolean
        required: false
        default: true
      keep_versions:
        description: "Max package versions to retain per package in feed (0 = keep all)"
        required: false
        default: "5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-apk-feed"
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      openwrt_series: ${{ steps.set.outputs.openwrt_series }}
      packages: ${{ steps.set.outputs.packages }}
      targets: ${{ steps.set.outputs.targets }}
      deploy_pages: ${{ steps.set.outputs.deploy_pages }}
      keep_versions: ${{ steps.set.outputs.keep_versions }}
    steps:
      - id: set
        env:
          INPUT_SERIES: ${{ github.event.inputs.openwrt_series }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          INPUT_DEPLOY: ${{ github.event.inputs.deploy_pages }}
          INPUT_KEEP_VERSIONS: ${{ github.event.inputs.keep_versions }}
        run: |
          SERIES="${INPUT_SERIES:-25.12}"
          if [ -z "$INPUT_SERIES" ] && [[ "${GITHUB_REF_NAME}" == openwrt-* ]]; then
            SERIES="${GITHUB_REF_NAME#openwrt-}"
          fi
          PACKAGES="${INPUT_PACKAGES:-all}"
          TARGETS="${INPUT_TARGETS:-[\"mediatek/filogic\",\"mediatek/mt7622\"]}"
          DEPLOY="${INPUT_DEPLOY:-true}"
          KEEP_VERSIONS="${INPUT_KEEP_VERSIONS:-5}"

          echo "openwrt_series=${SERIES}" >> "$GITHUB_OUTPUT"
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"
          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"
          echo "deploy_pages=${DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "keep_versions=${KEEP_VERSIONS}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-matrix.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and sign OpenWrt APK v3 packages
        env:
          SERIES: ${{ needs.prepare-matrix.outputs.openwrt_series }}
          PACKAGES: ${{ needs.prepare-matrix.outputs.packages }}
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh \
            --mode docker \
            --target "${{ matrix.target }}" \
            --package "${PACKAGES}" \
            --openwrt-series "${SERIES}" \
            --docker-tag "openwrt-${SERIES}" \
            --export-apk-bin .build/apk-host \
            --require-signing \
            --no-cache

          # Verify exported public signing key and host apk v3 tool exist
          test -n "$(find "dist/${SERIES}" -name 'public-key.pem' -print -quit)"
          test -x .build/apk-host

          # Record sanitized target name for unique artifact naming (both mediatek/filogic and mediatek/mt7622 share aarch64_cortex-a53)
          TARGET_SLUG="$(printf '%s' "${{ matrix.target }}" | tr '/' '-')"
          echo "ARTIFACT_TARGET=${TARGET_SLUG}" >> "$GITHUB_ENV"

      - name: Upload target APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ needs.prepare-matrix.outputs.openwrt_series }}-${{ env.ARTIFACT_TARGET }}
          path: dist/${{ needs.prepare-matrix.outputs.openwrt_series }}/**
          if-no-files-found: error

      - name: Upload static host apk v3 binary
        uses: actions/upload-artifact@v7
        with:
          name: apk-host-${{ env.ARTIFACT_TARGET }}
          path: .build/apk-host
          if-no-files-found: error

  publish:
    needs: [prepare-matrix, build]
    if: needs.prepare-matrix.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download all target APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-${{ needs.prepare-matrix.outputs.openwrt_series }}-*
          path: staging

      - name: Download static host apk v3 binary
        uses: actions/download-artifact@v8
        with:
          pattern: apk-host-*
          path: staging-tools

      - name: Assemble, merge & sign GitHub Pages APK v3 feed
        env:
          SERIES: ${{ needs.prepare-matrix.outputs.openwrt_series }}
          KEEP_VERSIONS: ${{ needs.prepare-matrix.outputs.keep_versions }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p "public/${SERIES}"

          APK_HOST_BIN="$(find staging-tools -type f -name 'apk-host' | head -n 1)"
          test -n "$APK_HOST_BIN"
          chmod +x "$APK_HOST_BIN"
          chmod +x scripts/merge-feed.sh

          # Copy newly built APKs and publish feed ECDSA public key
          PUB_FOUND=""
          for target_dir in staging/apk-"${SERIES}"-*; do
            [ -d "$target_dir" ] || continue
            for arch_dir in "${target_dir}"/*; do
              [ -d "$arch_dir" ] || continue
              arch="$(basename "$arch_dir")"
              mkdir -p "public/${SERIES}/${arch}"
              cp -pf "${arch_dir}"/*.apk "public/${SERIES}/${arch}/"
              if [ -z "$PUB_FOUND" ] && [ -f "${arch_dir}/public-key.pem" ]; then
                cp -f "${arch_dir}/public-key.pem" public/public-key.pem
                PUB_FOUND=1
              fi
            done
          done

          if [ -z "$PUB_FOUND" ] && [ -f keys/public-key.pem ]; then
            cp -f keys/public-key.pem public/public-key.pem
          fi

          # Merge previously published APKs from live Pages feed, prune old versions, and re-sign packages.adb
          for arch_dir in "public/${SERIES}"/*; do
            [ -d "$arch_dir" ] || continue
            arch="$(basename "$arch_dir")"
            ./scripts/merge-feed.sh \
              --feed-dir "$arch_dir" \
              --upstream-url "${PAGES_BASE_URL%/}/${SERIES}/${arch}" \
              --apk-bin "$APK_HOST_BIN" \
              --keep-versions "$KEEP_VERSIONS" \
              --require-signing
          done

          # Generate static landing page listing architectures and all retained package versions in a table
          {
            cat <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>OpenWrt ${SERIES} APK v3 Package Feed</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
              code { font-family: ui-monospace, monospace; }
              table { width: 100%; border-collapse: collapse; margin: 0.75rem 0 1.5rem; }
              th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #d0d7de; }
              th { background: #f6f8fa; font-weight: 600; }
              td.num, th.num { text-align: right; white-space: nowrap; }
              td.date, th.date { white-space: nowrap; }
            </style>
          </head>
          <body>
            <h1>OpenWrt ${SERIES} APK v3 Package Feed</h1>
            <p>Public signing key: <a href="public-key.pem">public-key.pem</a></p>
            <h2>Available Architectures (${SERIES})</h2>
          HTML
            for arch_dir in "public/${SERIES}"/*; do
              [ -d "$arch_dir" ] || continue
              arch="$(basename "$arch_dir")"
              printf '  <h3><code>%s</code></h3>\n' "$arch"
              printf '  <p><a href="%s/%s/packages.adb">packages.adb</a> | <a href="%s/%s/SHA256SUMS">SHA256SUMS</a></p>\n' \
                "$SERIES" "$arch" "$SERIES" "$arch"
              cat <<'HTML'
            <table>
              <thead>
                <tr>
                  <th>Package</th>
                  <th class="num">Size</th>
                  <th class="date">Build Date (UTC)</th>
                </tr>
              </thead>
              <tbody>
          HTML
              for apk_file in $(find "$arch_dir" -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort -V -r); do
                apk_path="${arch_dir}/${apk_file}"
                apk_size="$(numfmt --to=iec-i --suffix=B "$(stat -c '%s' "$apk_path")")"
                apk_date="$(date -u -d "@$(stat -c '%Y' "$apk_path")" '+%Y-%m-%d %H:%M UTC')"
                printf '      <tr><td><a href="%s/%s/%s"><code>%s</code></a></td><td class="num">%s</td><td class="date">%s</td></tr>\n' \
                  "$SERIES" "$arch" "$apk_file" "$apk_file" "$apk_size" "$apk_date"
              done
              cat <<'HTML'
              </tbody>
            </table>
          HTML
            done
            cat <<'HTML'
          </body>
          </html>
          HTML
          } > public/index.html

          find public -maxdepth 3 | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: [prepare-matrix, publish]
    if: needs.prepare-matrix.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
